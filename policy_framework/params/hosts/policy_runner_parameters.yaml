policy_runner:
  sources:
    type: string_array
    default_value: []
    description: "Input source names; each needs <source>.type."
    read_only: true
    validation:
      unique<>: null
  __map_sources:
    type:
      type: string
      description: "InputSource plugin class of the source."
      read_only: true
      validation:
        not_empty<>: null
    max_age:
      type: double
      default_value: 0.0
      description: "Fault when the latest message of the source arrived longer ago than this, in seconds (on the receive time); 0: off. Not for a command source: its timeout handles a stopped operator."
      read_only: true
      validation:
        gt_eq<>: [0.0]
    max_age_on_fault:
      type: string
      default_value: "error"
      description: "Reaction to max_age: neutral_commands, hold, damp, safe or error."
      read_only: true
      validation:
        one_of<>: [["neutral_commands", "hold", "damp", "safe", "error"]]
  policies:
    type: string_array
    description: "Policy names; the first one is active at start and is the one max_steps returns to."
    read_only: true
    validation:
      not_empty<>: null
      unique<>: null
  __map_policies:
    preprocessor:
      type: string
      description: "Preprocessor plugin class."
      read_only: true
      validation:
        not_empty<>: null
    inference:
      type: string
      default_value: "policy_framework/OnnxInference"
      description: "Inference plugin class."
      read_only: true
      validation:
        not_empty<>: null
    postprocessor:
      type: string
      description: "Postprocessor plugin class."
      read_only: true
      validation:
        not_empty<>: null
    max_steps:
      type: int
      default_value: 0
      description: "> 0: return to the first policy after this many steps (e.g. a motion length)."
      read_only: true
      validation:
        gt_eq<>: [0]
    interruptible:
      type: bool
      default_value: true
      description: "false: switch requests are rejected while this policy is active."
      read_only: true
    disabled_safety_checks:
      type: string_array
      default_value: []
      description: "Safety checks skipped while this policy is active, e.g. a joint velocity bound for a jump: names from safety_checks, or the monitor checks tilt, joint_position_limits and max_input_age. Sources' and terms' max_age always apply."
      read_only: true
      validation:
        unique<>: null
  safety_entry:
    type: string
    default_value: ""
    description: "State entry (a state interface in PolicyController, e.g. rl_safety_controller/safe) that is 0 while user commands (velocity command, motion reference) must be ignored and replaced by neutral ones. Empty: always accepted."
    read_only: true
  on_policy_failure:
    type: string
    default_value: "error"
    description: "Reaction to a failed policy step, including a model answering a non-finite value. Not neutral_commands: the policy itself failed."
    read_only: true
    validation:
      one_of<>: [["hold", "damp", "safe", "error"]]
  safety:
    max_tilt:
      type: double
      default_value: 0.0
      description: "Largest angle (rad) between the IMU z axis and the vertical; 0: off."
      read_only: true
      validation:
        gt_eq<>: [0.0]
    imu:
      type: string
      default_value: ""
      description: "State entry prefix of the IMU orientation, <imu>/orientation.{x,y,z,w}; needed by max_tilt."
      read_only: true
    joint_position_limits:
      type: bool
      default_value: false
      description: "Fault when a commanded joint leaves the position limits of the robot description, narrowed by position_margin."
      read_only: true
    position_margin:
      type: double
      default_value: 0.0
      description: "Distance the commanded joints must keep from their position limits."
      read_only: true
      validation:
        gt_eq<>: [0.0]
    max_input_age:
      type: double
      default_value: 0.0
      description: "Largest age (s) of the observation of the last policy step; 0: off."
      read_only: true
      validation:
        gt_eq<>: [0.0]
    tilt_on_fault:
      type: string
      default_value: "error"
      description: "Reaction to max_tilt: neutral_commands, hold, damp, safe or error."
      read_only: true
      validation:
        one_of<>: [["neutral_commands", "hold", "damp", "safe", "error"]]
    joint_position_on_fault:
      type: string
      default_value: "error"
      description: "Reaction to joint_position_limits: neutral_commands, hold, damp, safe or error."
      read_only: true
      validation:
        one_of<>: [["neutral_commands", "hold", "damp", "safe", "error"]]
    input_age_on_fault:
      type: string
      default_value: "error"
      description: "Reaction to max_input_age: neutral_commands, hold, damp, safe or error."
      read_only: true
      validation:
        one_of<>: [["neutral_commands", "hold", "damp", "safe", "error"]]
  safety_checks:
    type: string_array
    default_value: []
    description: "SafetyCheck plugin names; each needs <check>.type, and has a <check>.on_fault (default error)."
    read_only: true
    validation:
      unique<>: null
  __map_safety_checks:
    type:
      type: string
      description: "SafetyCheck plugin class of the check."
      read_only: true
      validation:
        not_empty<>: null
    on_fault:
      type: string
      default_value: "error"
      description: "Reaction to this check failing: neutral_commands, hold, damp, safe or error."
      read_only: true
      validation:
        one_of<>: [["neutral_commands", "hold", "damp", "safe", "error"]]
  publish_steps:
    type: bool
    default_value: false
    description: "Publish every policy step (model inputs and outputs, input stamps, commands) as a policy_framework/msg/PolicyStep on ~/policy_step, to record it and to replay it through a model (policy_replay)."
    read_only: true
  executors:
    type: string_array
    default_value: []
    description: "Executor names; each needs <executor>.type: a topic Executor in policy_node, an InterfaceExecutor in PolicyController."
    read_only: true
    validation:
      unique<>: null
  __map_executors:
    type:
      type: string
      description: "Executor plugin class."
      read_only: true
      validation:
        not_empty<>: null
