state_bounds_check:
  prefixes:
    type: string_array
    description: "Prefixes of the checked state entries <prefix>/<interface>, e.g. joint or actuator names."
    read_only: true
    validation:
      not_empty<>: null
      unique<>: null
  interfaces:
    type: string_array
    description: "Interfaces checked for every prefix, e.g. temperature, error_code; each needs <interface>.min and/or <interface>.max."
    read_only: true
    validation:
      not_empty<>: null
      unique<>: null
  __map_interfaces:
    min:
      type: double
      default_value: -1.0e+300
      description: "Lowest allowed value; default: unbounded."
      read_only: true
    max:
      type: double
      default_value: 1.0e+300
      description: "Highest allowed value; default: unbounded."
      read_only: true
    hysteresis:
      type: double
      default_value: 0.0
      description: "Once failed, an entry passes again only within [min + hysteresis, max - hysteresis]."
      read_only: true
      validation:
        gt_eq<>: [0.0]
  escalation:
    count:
      type: int
      default_value: 0
      description: "Entries failing at once from which the check asks for escalation.on_fault instead of its configured on_fault; 0: never."
      read_only: true
      validation:
        gt_eq<>: [0]
    on_fault:
      type: string
      default_value: "error"
      description: "Reaction asked for from escalation.count failing entries on."
      read_only: true
      validation:
        one_of<>: [["neutral_commands", "hold", "damp", "safe", "error"]]
  trigger_cycles:
    type: int
    default_value: 1
    description: "Consecutive violations of an entry before the check fails."
    read_only: true
    validation:
      gt_eq<>: [1]
