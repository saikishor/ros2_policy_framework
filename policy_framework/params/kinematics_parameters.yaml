kinematics:
  enabled:
    type: bool
    default_value: false
    description: "Build the whole-body kinematic model from the robot description, updated from <joint>/position and <joint>/velocity on every controller update / node tick (once all were received)."
    read_only: true
  joints:
    type: string_array
    default_value: []
    description: "Joints updated from the state; the other movable joints are locked at zero. Empty: every movable joint of the robot description."
    read_only: true
    validation:
      unique<>: null
