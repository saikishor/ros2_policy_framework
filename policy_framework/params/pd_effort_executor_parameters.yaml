pd_effort_executor:
  joints:
    type: string_array
    default_value: []
    description: "Joints to drive; empty: every command entry <joint>/position."
    read_only: true
    validation:
      unique<>: null
  effort_interface:
    type: string
    default_value: "effort"
    description: "Command interface <joint>/<effort_interface> written."
    read_only: true
    validation:
      not_empty<>: null
  stiffness:
    type: double_array
    default_value: []
    description: "Kp per joint, used when the policy does not write <joint>/stiffness commands."
    read_only: true
    validation:
      lower_element_bounds<>: [0.0]
  damping:
    type: double_array
    default_value: []
    description: "Kd per joint, used when the policy does not write <joint>/damping commands."
    read_only: true
    validation:
      lower_element_bounds<>: [0.0]
  effort_limits:
    type: double_array
    default_value: []
    description: "|effort| bound per joint (0: none); empty: no clamping."
    read_only: true
    validation:
      lower_element_bounds<>: [0.0]
