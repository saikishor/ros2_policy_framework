# Kangaroo full_body_4dof: two loco policies of pal_rl_policies, as a policy config. The
# equivalent of:
#
#   ros2 launch policy_framework_mjlab kangaroo_mjlab.launch.py robot_type:=full_body_4dof \
#       loco_models:=v1741,v1740
#
# Launch it with:
#
#   ros2 launch policy_framework_mjlab kangaroo_mjlab.launch.py robot_type:=full_body_4dof \
#       config:=examples/full_body_4dof_loco.yaml
#
# Each policy starts from the settings of its task in config/kangaroo/policies.yaml, gets the
# model_path of `model` (<task>/<version> under <models_dir>/<robot_type>), then its own keys on
# top. Names are free. The first policy must be a loco one: it is active at start and every
# imitation returns to it after its max_steps, the frame count of its motion, e.g.:
#
#   imitation_v30:
#     model: imitation/v30
#     max_steps: 300
policies: [loco_v1741, loco_v1740]
loco_v1741:
  model: loco/v1741
loco_v1740:
  model: loco/v1740
