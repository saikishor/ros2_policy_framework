# ros2_control controller computing the joint impedance itself: the policy runs at 50 Hz and
# PdEffortExecutor writes effort = kp (q_ref - q) + kd (dq_ref - dq) to the joint effort
# interfaces at 1 kHz, with the gains of the active policy. No pid_controller is needed.
policy_controller:
  ros__parameters:
    type: policy_framework/PolicyController
    policy_rate: 50.0
    # true: inference in its own real-time thread, the PD law stays in the control loop.
    async_inference: @ASYNC_INFERENCE@
    sources: [cmd_vel]
    # Velocity command of every policy, from one subscription shared by all of them (the
    # built-in `command` term reads cmd_vel/*); zero when older than timeout.
    cmd_vel:
      type: policy_framework/TwistSource
      topic: /cmd_vel
      timeout: 1.0
    executors: [pd]
    pd:
      type: policy_framework/PdEffortExecutor
