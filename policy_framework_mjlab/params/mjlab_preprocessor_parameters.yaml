mjlab_preprocessor:
  imu_name:
    type: string
    default_value: "imu"
    description: "Prefix of the IMU entries <imu_name>/orientation.*, angular_velocity.*, linear_acceleration.*."
    read_only: true
    validation:
      not_empty<>: null
  imu_frame:
    type: string
    default_value: ""
    description: "URDF link of the IMU. Needed (with kinematics.enabled) by the terms of pal_mjlab exports that observe the base: base_ang_vel, base_projected_gravity."
    read_only: true
  velocity_command_name:
    type: string
    default_value: "cmd_vel"
    description: "Prefix of the twist command entries of the built-in velocity command term."
    read_only: true
    validation:
      not_empty<>: null
  odometry_name:
    type: string
    default_value: "odom"
    description: "Prefix of the odometry entries <odometry_name>/linear.* (base_lin_vel)."
    read_only: true
    validation:
      not_empty<>: null
  observation_input:
    type: string
    default_value: "obs"
    description: "Model input receiving the observation."
    read_only: true
    validation:
      not_empty<>: null
  unknown_extra_inputs:
    type: string
    default_value: "error"
    description: "What to do with a model input other than the observation that has neither a built-in filler (time_step, obstacle_height) nor an extra_inputs.<input>.type plugin: 'error' fails the configuration, 'ignore' leaves it at zero."
    read_only: true
    validation:
      one_of<>: [["error", "ignore"]]
